services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: production
    container_name: fieldflow-app-prod
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - .env.production
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - CACHE_STORE=database
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
      - APP_RUN_MIGRATIONS=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fieldflow-network

  postgres:
    image: postgres:16-alpine
    container_name: fieldflow-postgres-prod
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-fieldflow}
      - POSTGRES_USER=${DB_USERNAME:-fieldflow}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fieldflow} -d ${DB_DATABASE:-fieldflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fieldflow-network

networks:
  fieldflow-network:
    driver: bridge

volumes:
  postgres-prod-data:
